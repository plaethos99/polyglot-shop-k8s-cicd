# ─────────────────────────────────────────────────────────────────────────────
# Cart Service — Java Spring Boot app
# Depends on: DynamoDB Local (carts-db)
#
# Note: AWS credentials are dummy values — DynamoDB Local doesn't actually
# validate them. They just need to be present for the SDK to work.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: retail-store
spec:
  selector:
    app: cart
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: retail-store
  labels:
    app: cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      initContainers:
        - name: wait-for-dynamodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z carts-db 8000; do
                echo "Waiting for DynamoDB Local at carts-db:8000..."
                sleep 3
              done
              echo "DynamoDB Local is ready!"
      containers:
        - name: cart
          image: YOUR_DOCKERHUB_USERNAME/cart:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_TOMCAT_ACCESSLOG_ENABLED
              value: "true"
            - name: RETAIL_CART_PERSISTENCE_PROVIDER
              value: dynamodb
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT
              value: "http://carts-db:8000"
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE
              value: "true"
            # Dummy AWS creds for DynamoDB Local (required by SDK, not validated locally)
            - name: AWS_ACCESS_KEY_ID
              value: "local"
            - name: AWS_SECRET_ACCESS_KEY
              value: "local"
            - name: AWS_REGION
              value: "us-east-1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
