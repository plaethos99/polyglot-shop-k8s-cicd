# ─────────────────────────────────────────────────────────────────────────────
# Checkout Service — Node.js (NestJS) app
# Depends on: Redis (checkout-redis)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: retail-store
spec:
  selector:
    app: checkout
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: retail-store
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z checkout-redis 6379; do
                echo "Waiting for Redis at checkout-redis:6379..."
                sleep 3
              done
              echo "Redis is ready!"
      containers:
        - name: checkout
          image: YOUR_DOCKERHUB_USERNAME/checkout:latest
          ports:
            - containerPort: 8080
          env:
            - name: RETAIL_CHECKOUT_PERSISTENCE_PROVIDER
              value: redis
            - name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
              value: "redis://checkout-redis:6379"
            # Orders service endpoint (checkout calls orders when purchase is placed)
            - name: RETAIL_CHECKOUT_ENDPOINTS_ORDERS
              value: "http://orders:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
