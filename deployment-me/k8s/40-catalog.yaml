# ─────────────────────────────────────────────────────────────────────────────
# Catalog Service — Go app that serves product catalog data from MariaDB
#
# Image: YOUR_DOCKERHUB_USERNAME/catalog:latest
#        (replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub username
#         or run: sed -i 's/YOUR_DOCKERHUB_USERNAME/yourname/g' *.yaml)
#
# initContainers: a small container that runs BEFORE the main app starts.
# It waits until MariaDB is ready so the catalog app doesn't crash on startup.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail-store
spec:
  selector:
    app: catalog
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail-store
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      # Wait for MariaDB before starting catalog
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z catalog-db 3306; do
                echo "Waiting for MariaDB at catalog-db:3306..."
                sleep 3
              done
              echo "MariaDB is ready!"
      containers:
        - name: catalog
          image: YOUR_DOCKERHUB_USERNAME/catalog:latest
          ports:
            - containerPort: 8080
          env:
            - name: GIN_MODE
              value: "release"
            - name: RETAIL_CATALOG_PERSISTENCE_PROVIDER
              value: mysql
            - name: RETAIL_CATALOG_PERSISTENCE_ENDPOINT
              value: "catalog-db:3306"
            - name: RETAIL_CATALOG_PERSISTENCE_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MYSQL_USER
            - name: RETAIL_CATALOG_PERSISTENCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MYSQL_PASSWORD
            - name: RETAIL_CATALOG_PERSISTENCE_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MYSQL_DATABASE
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
