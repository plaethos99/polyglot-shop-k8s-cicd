apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: retail-store
  region: eu-north-1
  version: "1.31"

iam:
  withOIDC: true

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 30
    volumeType: gp3
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        albIngress: true
        cloudWatch: true

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
