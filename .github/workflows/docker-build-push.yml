name: "1. Build and Push to Docker Hub"

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch: # Allows manual trigger from GitHub web UI button

jobs:
  build-and-push:
    name: "Build & Push: ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:    catalog
            context:    src/catalog
            dockerfile: src/catalog/Dockerfile

          - service:    orders
            context:    src/orders
            dockerfile: src/orders/Dockerfile

          - service:    cart
            context:    src/cart
            dockerfile: src/cart/Dockerfile

          - service:    checkout
            context:    src/checkout
            dockerfile: src/checkout/Dockerfile

          - service:    ui
            context:    src/ui
            dockerfile: src/ui/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push [${{ matrix.service }}]
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}
