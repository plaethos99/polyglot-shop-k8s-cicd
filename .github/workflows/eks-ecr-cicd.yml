name: EKS CI/CD Pipeline (Build, Push to ECR, Create EKS & Deploy)

on:
  push:
    branches:
      - main
      - feat/eks-ecr-cicd
    paths:
      - 'src/**'
      - 'deployment-me/k8s/**'
      - 'scripts/**'
      - '.github/workflows/eks-ecr-cicd.yml'
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'EKS Cluster Name'
        type: string
        default: 'my-cluster'
      aws_region:
        description: 'AWS Region'
        type: string
        default: 'eu-north-1'
      image_tag:
        description: 'Custom image tag (leave blank to use git commit SHA)'
        type: string
        default: ''

env:
  AWS_REGION: ${{ inputs.aws_region || vars.AWS_REGION || 'eu-north-1' }}
  EKS_CLUSTER_NAME: ${{ inputs.cluster_name || vars.EKS_CLUSTER_NAME || 'my-cluster' }}

jobs:
  # ============================================================================
  # JOB 1: Build Docker Images & Push to AWS ECR (Runs in parallel with Job 2)
  # ============================================================================
  build-and-push-ecr:
    name: "Build & Push ECR: ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:    catalog
            context:    src/catalog
            dockerfile: src/catalog/Dockerfile

          - service:    orders
            context:    src/orders
            dockerfile: src/orders/Dockerfile

          - service:    cart
            context:    src/cart
            dockerfile: src/cart/Dockerfile

          - service:    checkout
            context:    src/checkout
            dockerfile: src/checkout/Dockerfile

          - service:    ui
            context:    src/ui
            dockerfile: src/ui/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if ! aws ecr describe-repositories --repository-names "$SERVICE" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Creating ECR repository: $SERVICE"
            aws ecr create-repository \
              --repository-name "$SERVICE" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          else
            echo "ECR repository '$SERVICE' already exists."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fix checkout permissions if needed
      - name: Patch checkout Dockerfile chown if service is checkout
        if: matrix.service == 'checkout'
        run: |
          sed -i 's/COPY --chown=[^ ]* package/COPY package/g' src/checkout/Dockerfile 2>/dev/null || true
          sed -i 's/COPY --chown=[^ ]* \. \./COPY . ./g' src/checkout/Dockerfile 2>/dev/null || true
          sed -i 's/--chown=node:node/--chown=1000:1000/g' src/checkout/Dockerfile 2>/dev/null || true
          sed -i 's/--chown=appuser:appuser/--chown=1000:1000/g' src/checkout/Dockerfile 2>/dev/null || true

      - name: Build & Push to AWS ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================================
  # JOB 2: Ensure or Automatically Create EKS Cluster via eksctl
  # ============================================================================
  create-or-verify-eks-cluster:
    name: "Ensure / Create EKS Cluster"
    needs: [build-and-push-ecr]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Verify EC2 Instance Quota & Permissions
        id: check-instances
        run: |
          echo "🔍 Checking availability and quota for t3.medium in $AWS_REGION..."
          CHOSEN_TYPE="t3.medium"
          
          # Check if t3.medium is available in this region
          OFFERED=$(aws ec2 describe-instance-type-offerings \
            --location-type availability-zone \
            --filters Name=instance-type,Values=t3.medium \
            --region "$AWS_REGION" \
            --query "length(InstanceTypeOfferings)" \
            --output text 2>/dev/null || echo "0")
            
          if [ "$OFFERED" -gt 0 ]; then
            echo "✔ t3.medium is fully permitted and supported across $OFFERED AZs in $AWS_REGION."
          else
            echo "⚠️ t3.medium not offered. Falling back to t2.medium..."
            CHOSEN_TYPE="t2.medium"
          fi

          echo "selected_type=$CHOSEN_TYPE" >> $GITHUB_OUTPUT

      - name: Check if EKS Cluster exists or Create it
        env:
          NODE_TYPE: ${{ steps.check-instances.outputs.selected_type }}
        run: |
          echo "🔍 Checking if EKS cluster '$EKS_CLUSTER_NAME' exists in region $AWS_REGION..."
          if aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            CLUSTER_STATUS=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query "cluster.status" --output text)
            echo "✔ EKS cluster '$EKS_CLUSTER_NAME' already exists! Current status: $CLUSTER_STATUS"
            if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
              echo "⏳ Waiting for cluster to transition to ACTIVE state..."
              aws eks wait cluster-active --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
            fi
          else
            echo "⚙ EKS cluster '$EKS_CLUSTER_NAME' does not exist."
            echo "🚀 Launching new EKS cluster with 2 worker nodes ($NODE_TYPE) via eksctl..."
            
            eksctl create cluster \
              --name "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --version "1.31" \
              --nodegroup-name "my-nodes" \
              --node-type "$NODE_TYPE" \
              --nodes 2 \
              --nodes-min 1 \
              --nodes-max 4 \
              --managed \
              --with-oidc
              
            echo "✔ EKS Cluster successfully created by GitHub Actions!"
          fi

          # Ensure the cluster has worker nodegroups attached
          echo "🔍 Checking for active nodegroups on cluster '$EKS_CLUSTER_NAME'..."
          NODEGROUPS=$(aws eks list-nodegroups --cluster-name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query "nodegroups" --output text 2>/dev/null || true)
          if [ -z "$NODEGROUPS" ] || [ "$NODEGROUPS" = "None" ]; then
            echo "⚠️ Cluster exists but has NO worker nodegroups! Creating managed nodegroup 'my-nodes' (2x $NODE_TYPE)..."
            
            # Check if cluster was created by eksctl (has CloudFormation stack)
            if aws cloudformation describe-stacks --stack-name "eksctl-${EKS_CLUSTER_NAME}-cluster" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "✔ Found eksctl cluster stack. Adding nodegroup via eksctl..."
              eksctl create nodegroup \
                --cluster "$EKS_CLUSTER_NAME" \
                --region "$AWS_REGION" \
                --name "my-nodes" \
                --node-type "$NODE_TYPE" \
                --nodes 2 \
                --nodes-min 1 \
                --nodes-max 4 \
                --managed
            else
              echo "ℹ Cluster was created outside of eksctl (e.g. AWS Console). Discovering cluster VPC and subnets..."
              VPC_ID=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query "cluster.resourcesVpcConfig.vpcId" --output text)
              SUBNET_IDS=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query "cluster.resourcesVpcConfig.subnetIds" --output text)
              
              echo "Discovered VPC: $VPC_ID"
              echo "Discovered Subnets: $SUBNET_IDS"
              
              cat <<EOF > /tmp/nodegroup-config.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: $EKS_CLUSTER_NAME
  region: $AWS_REGION
  version: "1.31"
vpc:
  id: "$VPC_ID"
  subnets:
    public:
EOF
              SUBNET_INDEX=1
              for SUBNET in $SUBNET_IDS; do
                cat <<EOF >> /tmp/nodegroup-config.yaml
      sub-$SUBNET_INDEX:
        id: "$SUBNET"
EOF
                SUBNET_INDEX=$((SUBNET_INDEX + 1))
              done
              
              cat <<EOF >> /tmp/nodegroup-config.yaml
managedNodeGroups:
  - name: my-nodes
    instanceType: $NODE_TYPE
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
    volumeSize: 30
    volumeType: gp3
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        albIngress: true
        cloudWatch: true
EOF

              echo "Generated dynamic nodegroup config:"
              cat /tmp/nodegroup-config.yaml
              
              eksctl create nodegroup -f /tmp/nodegroup-config.yaml
            fi
            echo "✔ Nodegroup 'my-nodes' successfully created!"
          else
            echo "✔ Active nodegroups found: $NODEGROUPS"
          fi

  # ============================================================================
  # JOB 3: Deploy Polyglot Shop to AWS EKS
  # ============================================================================
  deploy-to-eks:
    name: "Deploy to AWS EKS Cluster"
    needs: [create-or-verify-eks-cluster]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Run EKS Deployment Script
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          TARGET_TAG="${INPUT_TAG:-${{ github.sha }}}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          
          chmod +x scripts/deploy-eks.sh
          ./scripts/deploy-eks.sh "$EKS_CLUSTER_NAME" "$AWS_REGION" "$ACCOUNT_ID" "$TARGET_TAG"

      - name: Publish Deployment Summary
        if: always()
        run: |
          NAMESPACE="retail-store"
          LB_HOSTNAME=$(kubectl -n "$NAMESPACE" get svc ui -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Pending")
          
          echo "### 🚀 EKS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** \`$EKS_CLUSTER_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`$AWS_REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Service Endpoint:** [http://$LB_HOSTNAME:8080](http://$LB_HOSTNAME:8080)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Pods Status:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl -n "$NAMESPACE" get pods -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
