name: EKS CI/CD Pipeline (Build, Push to ECR, Create EKS & Deploy)

on:
  push:
    branches:
      - main
      - feat/eks-ecr-cicd
    paths:
      - 'src/**'
      - 'deployment-me/k8s/**'
      - 'scripts/**'
      - '.github/workflows/eks-ecr-cicd.yml'
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'EKS Cluster Name'
        type: string
        default: 'my-cluster'
      aws_region:
        description: 'AWS Region'
        type: string
        default: 'eu-north-1'
      image_tag:
        description: 'Custom image tag (leave blank to use git commit SHA)'
        type: string
        default: ''

env:
  AWS_REGION: ${{ inputs.aws_region || vars.AWS_REGION || 'eu-north-1' }}
  EKS_CLUSTER_NAME: ${{ inputs.cluster_name || vars.EKS_CLUSTER_NAME || 'my-cluster' }}

jobs:
  # ============================================================================
  # JOB 1: Build Docker Images & Push to AWS ECR (Runs in parallel with Job 2)
  # ============================================================================
  build-and-push-ecr:
    name: "Build & Push ECR: ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:    catalog
            context:    src/catalog
            dockerfile: src/catalog/Dockerfile

          - service:    orders
            context:    src/orders
            dockerfile: src/orders/Dockerfile

          - service:    cart
            context:    src/cart
            dockerfile: src/cart/Dockerfile

          - service:    checkout
            context:    src/checkout
            dockerfile: src/checkout/Dockerfile

          - service:    ui
            context:    src/ui
            dockerfile: src/ui/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if ! aws ecr describe-repositories --repository-names "$SERVICE" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Creating ECR repository: $SERVICE"
            aws ecr create-repository \
              --repository-name "$SERVICE" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          else
            echo "ECR repository '$SERVICE' already exists."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fix checkout permissions if needed
      - name: Patch checkout Dockerfile chown if service is checkout
        if: matrix.service == 'checkout'
        run: |
          sed -i 's/COPY --chown=[^ ]* package/COPY package/g' src/checkout/Dockerfile 2>/dev/null || true
          sed -i 's/COPY --chown=[^ ]* \. \./COPY . ./g' src/checkout/Dockerfile 2>/dev/null || true
          sed -i 's/--chown=node:node/--chown=1000:1000/g' src/checkout/Dockerfile 2>/dev/null || true
          sed -i 's/--chown=appuser:appuser/--chown=1000:1000/g' src/checkout/Dockerfile 2>/dev/null || true

      - name: Build & Push to AWS ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================================
  # JOB 2: Provision EKS Cluster & Managed Worker Nodes via Terraform
  # ============================================================================
  provision-eks-terraform:
    name: "Provision EKS Cluster (Terraform)"
    needs: [build-and-push-ecr]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init & Apply
        run: |
          cd terraform/eks-cluster
          terraform init
          terraform apply -auto-approve \
            -var="cluster_name=$EKS_CLUSTER_NAME" \
            -var="aws_region=$AWS_REGION" \
            -var="nodegroup_name=my-nodes" \
            -var="node_type=t3.medium" \
            -var="desired_nodes=2" \
            -var="min_nodes=1" \
            -var="max_nodes=4"

      - name: Verify Worker Nodes are Ready
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          echo "Waiting up to 3 minutes for worker nodes to report Ready..."
          for i in {1..18}; do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            if [ "$NODE_COUNT" -gt 0 ]; then
              break
            fi
            sleep 10
          done
          kubectl get nodes -o wide

  # ============================================================================
  # JOB 3: Deploy Polyglot Shop to AWS EKS
  # ============================================================================
  deploy-to-eks:
    name: "Deploy to AWS EKS Cluster"
    needs: [provision-eks-terraform]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Run EKS Deployment Script
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          TARGET_TAG="${INPUT_TAG:-${{ github.sha }}}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          
          chmod +x scripts/deploy-eks.sh
          ./scripts/deploy-eks.sh "$EKS_CLUSTER_NAME" "$AWS_REGION" "$ACCOUNT_ID" "$TARGET_TAG"

      - name: Publish Deployment Summary
        if: always()
        run: |
          NAMESPACE="retail-store"
          LB_HOSTNAME=$(kubectl -n "$NAMESPACE" get svc ui -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Pending")
          
          echo "### 🚀 EKS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** \`$EKS_CLUSTER_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`$AWS_REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Service Endpoint:** [http://$LB_HOSTNAME:8080](http://$LB_HOSTNAME:8080)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Pods Status:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl -n "$NAMESPACE" get pods -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
